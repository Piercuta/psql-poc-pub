# Desired content of the PostgreSQL server, applied by Terraform (02-db-config stack).
# Everything is created if missing, together with its schemas and extensions.
# Removing an entry removes the matching grants/roles/schemas.

configuration:
  databases:
    # Online shop application
    shop:
      schemas:
        - catalog # products, prices, stock
        - orders # carts, orders, payments
      extensions:
        - pg_trgm # fuzzy product search
        - pgcrypto

    # Data platform: ingestion, transformation and BI reporting
    analytics:
      schemas:
        - raw # data loaded as-is from the sources
        - staging # cleaned and joined data
        - reporting # tables and views consumed by BI dashboards
      extensions:
        - tablefunc # crosstab / pivot queries
        - pgcrypto

  # One login per identity. The only supported authentication is "password":
  # the password is generated by Terraform and stored in a Secrets Manager secret
  # (never in this file).
  logins:
    - { username: shop_owner, authentication: password } # schema migrations of the shop
    - { username: analytics_owner, authentication: password } # schema migrations of the data platform
    - { username: bi_admin, authentication: password } # manages the reporting layer
    - { username: shop_api, authentication: password } # shop backend service
    - { username: etl_worker, authentication: password } # nightly ingestion jobs
    - { username: bi_reader, authentication: password } # BI dashboards
    - { username: support_readonly, authentication: password } # customer support tooling

  # Access rights. Without "schema", the mapping applies to every schema of the database.
  # A mapping with a "schema" overrides a mapping without one for the schema ownership.
  mappings:
    # Ownership
    - { level: owner, username: shop_owner, database: shop }
    - { level: owner, username: analytics_owner, database: analytics }
    - { level: owner, username: bi_admin, database: analytics, schema: reporting } # overrides analytics_owner

    # Shop backend: writes orders, only reads the catalog
    - { level: writer, username: shop_api, database: shop, schema: orders }
    - { level: reader, username: shop_api, database: shop, schema: catalog }

    # Customer support: read-only on the whole shop
    - { level: reader, username: support_readonly, database: shop }

    # ETL: extracts from the shop, loads raw and staging
    - { level: reader, username: etl_worker, database: shop }
    - { level: writer, username: etl_worker, database: analytics, schema: raw }
    - { level: writer, username: etl_worker, database: analytics, schema: staging }

    # BI dashboards: read-only on the reporting layer
    - { level: reader, username: bi_reader, database: analytics, schema: reporting }

# Levels (owner / writer / reader) are defined once, in config.tf, not in this file:
#   reader = CONNECT, USAGE, SELECT (tables and sequences)
#   writer = reader + INSERT, UPDATE, DELETE
#   owner  = owner of the schema
